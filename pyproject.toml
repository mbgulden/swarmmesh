[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmmesh"
version = "0.1.0"
description = "Zero-dependency distributed event mesh and peer-to-peer agent RPC system"
readme = "README.md"
authors = [{ name = "Michael Gulden", email = "michael@growthwebdev.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.20.0", "mypy>=1.0.0"]

[project.scripts]
swarmmesh = "swarmmesh.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
swarmmesh = ["py.typed"]

[project.urls]
Homepage = "https://github.com/mbgulden/swarmmesh"
